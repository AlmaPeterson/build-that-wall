<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0,0,640,360"><rect x="30" y="28" width="580" height="322" rx="14" fill="#ffffff" stroke="#d8332d" stroke-width="4"/><rect x="30" y="28" width="580" height="44" rx="14" fill="#d8332d"/><rect x="30" y="56" width="580" height="16" fill="#d8332d"/><text x="320" y="58" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">How to Play: Goal &amp; Setup</text><text x="52" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Goal: have the most miles of wall when the game ends.</text><text x="52" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Players: 2 to 6 (3 or 4 is best). Change the number of players in Settings.</text><text x="52" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Setup: press Start Game. The deck is shuffled and every player is dealt 5 cards.</text><text x="64" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">The rest of the deck becomes the Draw pile.</text><text x="52" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• The player to the left of the dealer goes first, then play moves clockwise.</text><text x="52" y="221" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Play Immediately cards have a red title. You must use them right away: at the</text><text x="64" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">start of your first turn, or as soon as you draw one. They don&#x27;t cost an action.</text><text x="320" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="middle">Page 1 of 4</text></svg>