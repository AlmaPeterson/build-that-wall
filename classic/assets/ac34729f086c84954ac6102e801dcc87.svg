<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0,0,640,360"><rect x="30" y="28" width="580" height="322" rx="14" fill="#ffffff" stroke="#d8332d" stroke-width="4"/><rect x="30" y="28" width="580" height="44" rx="14" fill="#d8332d"/><rect x="30" y="56" width="580" height="16" fill="#d8332d"/><text x="320" y="58" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">How to Play: Building Walls</text><text x="52" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• To build, discard a Man Hour card (or 3 Wall Section cards) and lay a Wall</text><text x="64" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">Section face up in front of you.</text><text x="52" y="143" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Matching sections stack together: 1 section = 3 miles, 2 sections = 8 miles, 3</text><text x="64" y="162" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">sections = 16 miles.</text><text x="52" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">3 matching sections make a complete wall set. A complete set can&#x27;t be taken or</text><text x="64" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">destroyed.</text><text x="52" y="233" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• You can discard 2 Wall Section cards from your hand to use them as a Man Hour</text><text x="64" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">(this uses 1 action).</text><text x="52" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Voting Machine works as a Man Hour that builds 2 sections with one action.</text><text x="320" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="middle">Page 3 of 4</text></svg>