<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0,0,640,360"><rect x="30" y="28" width="580" height="294" rx="14" fill="#ffffff" stroke="#d8332d" stroke-width="4"/><rect x="30" y="28" width="580" height="44" rx="14" fill="#d8332d"/><rect x="30" y="56" width="580" height="16" fill="#d8332d"/><text x="320" y="58" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">How to Play: Winning &amp; Key Cards</text><text x="52" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• The game ends when a player completes 3 wall sets, or (faster game) when the</text><text x="64" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">Draw pile runs out and everyone gets one last turn. Most miles of wall wins!</text><text x="52" y="143" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Debt: take a built section from an opponent. They can block it with Savings.</text><text x="52" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Self-Defense: stops a bad effect aimed at you.</text><text x="52" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Trump: discard to draw 3 cards. Trump Train: draw 3 cards, or protect a set of</text><text x="64" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">2.</text><text x="52" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Every other card explains itself. Right-click a card to zoom in, then press Scan</text><text x="64" y="259" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">Card&#x27;s QR Code to open that card&#x27;s web page.</text><text x="320" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="middle">Page 4 of 4</text></svg>