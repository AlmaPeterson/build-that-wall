<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0,0,640,360"><rect x="30" y="28" width="580" height="294" rx="14" fill="#ffffff" stroke="#d8332d" stroke-width="4"/><rect x="30" y="28" width="580" height="44" rx="14" fill="#d8332d"/><rect x="30" y="56" width="580" height="16" fill="#d8332d"/><text x="320" y="58" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">How to Play: Taking Your Turn</text><text x="52" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">1. Draw 3 cards from the Draw pile. Use any Play Immediately cards you drew.</text><text x="52" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">2. Take up to 3 actions. You can skip actions if you want.</text><text x="52" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• An action is building a wall or playing a card. Most cards cost 1 action, but</text><text x="64" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">Play Immediately, Self-Defense, Savings and Wall Section cards do not.</text><text x="52" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• Played cards go to the Discard pile unless the card says otherwise. Once a card</text><text x="64" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">is played it can&#x27;t be taken back.</text><text x="52" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">3. Press End Turn when you are done. The next player draws their cards and their</text><text x="64" y="259" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">row on the Cards in Hand board turns red.</text><text x="52" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">• When the Draw pile runs out, the Discard pile is shuffled to make a new one.</text><text x="320" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="middle">Page 2 of 4</text></svg>