    <script type="application/ld+json">
      [{
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Build That Wall",
        "url": "https://almapeterson.github.io/build-that-wall/"
      }, {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Build That Wall",
        "url": "https://almapeterson.github.io/build-that-wall/",
        "description": "Race to build the longest wall while your rivals hit you with Debt, Quarantine and Trump Trains. Free in your browser: play bots, pass one device around, or play online with friends.",
        "image": "https://almapeterson.github.io/build-that-wall/og-image.png",
        "genre": ["Card game", "Strategy", "Political satire"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any (web browser)",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 2, "maxValue": 6 },
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

  </head>
  <body>
    <div id="app"></div>
    <script>
      // If the game can't start (this browser can't run it, or something broke), say so instead of a white page.
      (function () {
        var errors = [];
        function note(m) { if (m && errors.indexOf(m) < 0) errors.push(String(m).slice(0, 300)); }
        addEventListener('error', function (e) { note(e.message || (e.target && e.target.src && 'Could not load ' + e.target.src)); show(); }, true);
        addEventListener('unhandledrejection', function (e) { note(e.reason && (e.reason.stack || e.reason.message || e.reason)); });
        function show() {
          setTimeout(function () {
            var app = document.getElementById('app');
            if (!app || app.children.length || !errors.length) return;
            app.innerHTML = '<div style="font:16px/1.4 system-ui,sans-serif;padding:24px;max-width:560px;margin:auto;color:#222;background:#fff">'
              + '<h1 style="font-size:22px">The game couldn\'t start</h1>'
              + '<p>Try updating your browser, or press Start over.</p>'
              + '<button id="btw-start-over" style="font-size:16px;padding:10px 18px">Start over</button>'
              + '<pre style="white-space:pre-wrap;font-size:12px;color:#666;margin-top:20px"></pre></div>';
            app.querySelector('pre').textContent = errors.join('\n\n') + '\n\n' + navigator.userAgent;
            document.getElementById('btw-start-over').onclick = function () {
              try { localStorage.removeItem('btw:game'); } catch (x) {}
              location.reload();
            };
          }, 1500);
        }
        addEventListener('load', function () { setTimeout(show, 3000); });
      })();
    </script>
    <noscript>
      <main>
        <h1>Build That Wall</h1>
        <p>Build That Wall is an online political strategy card game for 2–6 players. Play against bots, pass one device around, or play online with friends.</p>
        <p>Build the most miles of wall before the game ends by using Wall Sections, action cards, and careful strategy.</p>
        <p>This game needs JavaScript. <a href="./how-to-play.html">Read how to play Build That Wall</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
